name: Build kontol APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: python3 generate_icons.py

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          # Try download dari services.gradle.org
          curl -L -o /tmp/gradle-8.4-bin.zip "https://services.gradle.org/distributions/gradle-8.4-bin.zip" 2>/dev/null || \
          curl -L -o /tmp/gradle-8.4-bin.zip "https://cdn.jsdelivr.net/gh/gradle/gradle@v8.4.0/gradle-8.4-bin.zip" 2>/dev/null || \
          curl -L -o /tmp/gradle-8.4-bin.zip "https://mirrors.aliyun.com/gradle/gradle-8.4-bin.zip" 2>/dev/null || \
          echo "Download failed, gradle akan download otomatis"
          
          # Extract wrapper JAR jika berhasil download
          if [ -f /tmp/gradle-8.4-bin.zip ]; then
            unzip -p /tmp/gradle-8.4-bin.zip gradle-8.4/lib/gradle-wrapper.jar > android/gradle/wrapper/gradle-wrapper.jar
            rm /tmp/gradle-8.4-bin.zip
          fi
          
          # Create fallback properties jika JAR tetap nggak ada
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER
          
          chmod +x android/gradlew
          
      - name: Setup gradle.properties
        run: |
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=4096m" >> android/gradle.properties

      - name: Clean Gradle Cache
        run: |
          cd android
          ./gradlew clean --no-daemon || true
          rm -rf .gradle build

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/SyncXxX.apk
          retention-days: 30
